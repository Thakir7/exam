<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>بوابة الاستعلام عن جدول الاختبارات</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Tahoma, Arial;
  background:#eef3fb;
  margin:0;
  padding:0;
  color:#1f2937;
}

.container{
  max-width:1100px;
  margin:30px auto;
  padding:20px;
}

/* ===== Header ===== */
.header{
  background:#ffffff;
  padding:20px 25px;
  border-radius:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.header h1{
  margin:0;
  font-size:26px;
}

.header small{
  display:block;
  color:#6b7280;
  margin-top:6px;
}

.badges span{
  background:#eef2ff;
  color:#1d4ed8;
  padding:8px 14px;
  border-radius:20px;
  margin-left:6px;
  font-size:14px;
}

/* ===== Card ===== */
.card{
  background:#ffffff;
  margin-top:25px;
  padding:25px;
  border-radius:20px;
  box-shadow:0 10px 35px rgba(0,0,0,.08);
}

/* ===== Search ===== */
.search-box{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.search-box input{
  flex:1;
  padding:14px;
  font-size:18px;
  border-radius:12px;
  border:2px solid #dbeafe;
}

.search-box button{
  padding:14px 22px;
  font-size:18px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}

/* ===== Info ===== */
.info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:20px;
}

.info div{
  background:#f8fafc;
  padding:18px;
  border-radius:14px;
  text-align:center;
  border:1px solid #e5e7eb;
}

/* ===== Table ===== */
table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  margin-top:25px;
}

thead th{
  background:#f1f5f9;
  padding:14px;
  font-size:16px;
}

tbody td{
  padding:14px;
  border-top:1px solid #e5e7eb;
  text-align:center;
}

.period1{background:#ecfeff;}
.period2{background:#fef3c7;}

.no-exam{
  background:#fee2e2;
  color:#991b1b;
  font-weight:bold;
}

.footer-note{
  margin-top:15px;
  font-size:14px;
  color:#64748b;
}
</style>
</head>

<body>

<div class="container">

  <!-- ===== HEADER ===== -->
  <div class="header">
    <div>
      <h1>بوابة الاستعلام عن جدول الاختبارات</h1>
      <small>الكلية التقنية – المؤسسة العامة للتدريب التقني والمهني</small>
    </div>
    <div class="badges">
      <span>TVTC</span>
      <span>Google Sheet</span>
      <span>Cloudflare</span>
    </div>
  </div>

  <!-- ===== CARD ===== -->
  <div class="card">

    <div class="search-box">
      <input id="tid" placeholder="أدخل الرقم التدريبي">
      <button onclick="search()">بحث</button>
    </div>

    <div class="info" id="info" style="display:none">
      <div>
        <strong>اسم المتدرب</strong><br>
        <span id="name"></span>
      </div>
      <div>
        <strong>الرقم التدريبي</strong><br>
        <span id="id"></span>
      </div>
    </div>

    <table id="table" style="display:none">
      <thead>
        <tr>
          <th>اليوم</th>
          <th>الفترة الأولى<br>8:30 – 10:00</th>
          <th>الفترة الثانية<br>10:30 – 12:00</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>

    <div class="footer-note">
      في حال عدم وجود اختبار سيظهر تنبيه واضح "لا يوجد اختبار".
    </div>

  </div>
</div>

<script>
const API_URL = "tvtc-exam-api.ensancom.workers.dev";
const API_KEY = "TVTC-1447-EXAM-KEY-9X2P";

async function search(){
  const id = document.getElementById("tid").value.trim();
  if(!id) return;

  const last4 = id.slice(-4);

  const res = await fetch(`${API_URL}?id=${id}&v=${last4}&key=${API_KEY}`);
  const data = await res.json();

  if(!data.ok){
    alert(data.message || "خطأ في البيانات");
    return;
  }

  document.getElementById("info").style.display="grid";
  document.getElementById("table").style.display="table";
  document.getElementById("name").textContent=data.traineeName;
  document.getElementById("id").textContent=data.traineeId;

  const tbody = document.getElementById("tbody");
  tbody.innerHTML="";

  data.days.forEach(d=>{
    const p1 = d.periods["1"]?.[0]?.courseName || "لا يوجد اختبار";
    const p2 = d.periods["2"]?.[0]?.courseName || "لا يوجد اختبار";

    tbody.innerHTML += `
      <tr>
        <td>${d.dayLabel}</td>
        <td class="${p1==='لا يوجد اختبار'?'no-exam':'period1'}">${p1}</td>
        <td class="${p2==='لا يوجد اختبار'?'no-exam':'period2'}">${p2}</td>
      </tr>
    `;
  });
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بوابة الاستعلام عن جدول الاختبارات</title>

<style>
body{font-family:Tahoma,Arial;background:#f3f4f6;margin:0}
.container{max-width:1100px;margin:30px auto;background:#fff;padding:25px;border-radius:14px;box-shadow:0 10px 25px rgba(0,0,0,.08)}
h1,h2{text-align:center;margin:0 0 15px}
.search-box{display:flex;gap:10px;justify-content:center;margin:15px 0}
input,button{padding:10px;border-radius:10px;border:1px solid #d1d5db;font-size:15px}
button{cursor:pointer;background:#2563eb;color:#fff;border:none}
button:hover{background:#1d4ed8}
.hidden{display:none}
.info{background:#eff6ff;padding:10px;border-radius:10px;margin-bottom:10px}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #e5e7eb;padding:8px;text-align:center}
th{background:#f9fafb}
.warn{color:#b91c1c;font-weight:bold;font-size:12px}
.forbidden{background:#fee2e2}
.admin-box{background:#f8fafc;border:1px dashed #cbd5f5;padding:15px;border-radius:10px;margin-top:20px}
.admin-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:12px}
.small{font-size:12px;color:#6b7280}
.footer{text-align:center;font-size:12px;color:#6b7280;margin-top:15px}
</style>
</head>

<body>
<div class="container">

<h1>بوابة الاستعلام عن جدول الاختبارات</h1>

<!-- ========== اختيار الوضع ========== -->
<div class="search-box">
  <button onclick="showStudent()">وضع المتدرب</button>
  <button onclick="showAdmin()">لوحة تحكم المدير</button>
</div>

<!-- ========== واجهة المتدرب ========== -->
<div id="studentView">
  <div class="search-box">
    <input id="traineeId" placeholder="أدخل الرقم التدريبي">
    <button onclick="searchTrainee()">بحث</button>
  </div>
  <div id="result"></div>
</div>

<!-- ========== لوحة تحكم المدير ========== -->
<div id="adminView" class="hidden">

  <div class="search-box">
    <input type="password" id="adminPass" placeholder="كلمة مرور المدير">
    <button onclick="loginAdmin()">دخول</button>
  </div>

  <div id="adminPanel" class="hidden admin-box">

    <h2>لوحة تحكم المدير</h2>

    <div class="admin-actions">
      <div class="card">
        <h4>اختبار الاتصال</h4>
        <button onclick="testAPI()">اختبار API</button>
        <div id="apiStatus" class="small"></div>
      </div>

      <div class="card">
        <h4>بحث تجريبي</h4>
        <input id="testId" placeholder="رقم تدريبي">
        <button onclick="searchTest()">بحث</button>
      </div>

      <div class="card">
        <h4>إعدادات الأمان</h4>
        <div class="small">
          ✔ محمي بـ Token<br>
          ✔ مقيّد GitHub Pages<br>
          ✔ Rate Limit مفعل
        </div>
      </div>

      <div class="card">
        <h4>ملاحظات</h4>
        <div class="small">
          سجلات الاستخدام محفوظة في Google Sheet (API_LOGS)
        </div>
      </div>
    </div>

    <button style="margin-top:15px;background:#dc2626" onclick="logoutAdmin()">تسجيل خروج</button>

  </div>
</div>

<div class="footer">
  البيانات تُجلب مباشرة من Google Sheets عبر Apps Script API
</div>

</div>

<script>
/* ===== إعدادات الاتصال ===== */
const API_URL   = "https://script.google.com/macros/s/AKfycbxGz87ofKfisrCyUNPMbCX1va-W1BrLteHABoX8kYj5nA9GGafYKrlhDl8xBTua_tym0g/exec";
const API_TOKEN = "SECRET_TOKEN_1447H";

/* كلمة مرور لوحة المدير (واجهة فقط) */
const ADMIN_PASSWORD = "admin@1447";

/* ===== وظائف عامة ===== */
function showStudent(){
  document.getElementById("studentView").classList.remove("hidden");
  document.getElementById("adminView").classList.add("hidden");
}
function showAdmin(){
  document.getElementById("adminView").classList.remove("hidden");
  document.getElementById("studentView").classList.add("hidden");
}
function loginAdmin(){
  if(document.getElementById("adminPass").value === ADMIN_PASSWORD){
    document.getElementById("adminPanel").classList.remove("hidden");
  } else {
    alert("كلمة المرور غير صحيحة");
  }
}
function logoutAdmin(){
  document.getElementById("adminPanel").classList.add("hidden");
}

/* ===== استدعاء API ===== */
async function callAPI(id){
  const res = await fetch(`${API_URL}?id=${encodeURIComponent(id)}&token=${API_TOKEN}`);
  return await res.json();
}

/* ===== المتدرب ===== */
async function searchTrainee(){
  const id = document.getElementById("traineeId").value.trim();
  if(!id) return alert("أدخل الرقم التدريبي");
  document.getElementById("result").innerHTML = "جاري البحث...";
  const data = await callAPI(id);
  if(!data.ok){
    document.getElementById("result").innerHTML = `<div class="warn">${data.message}</div>`;
    return;
  }
  renderTable(data);
}

/* ===== المدير ===== */
async function testAPI(){
  document.getElementById("apiStatus").innerText = "جاري الاختبار...";
  try{
    const res = await callAPI("000");
    document.getElementById("apiStatus").innerText = "✔ API يعمل";
  }catch{
    document.getElementById("apiStatus").innerText = "✖ فشل الاتصال";
  }
}
function searchTest(){
  document.getElementById("traineeId").value =
    document.getElementById("testId").value;
  showStudent();
  searchTrainee();
}

/* ===== عرض الجدول ===== */
function renderTable(data){
  let html = `<div class="info">
    <b>اسم المتدرب:</b> ${data.traineeName}<br>
    <b>الرقم التدريبي:</b> ${data.traineeId}
  </div>`;

  html += `<table>
    <tr>
      <th>اليوم</th>
      <th>الفترة الأولى</th>
      <th>الفترة الثانية</th>
      <th>الفترة الثالثة</th>
    </tr>`;

  data.days.forEach(d=>{
    html += `<tr><td>${d.dayLabel}</td>`;
    [1,2,3].forEach(p=>{
      const slot = d.periods[p];
      if(!slot || slot.length===0){
        html += `<td>-</td>`;
      }else{
        const conflict = slot.length>1;
        html += `<td class="${conflict?'forbidden':''}">`;
        slot.forEach((c,i)=>{
          html += `<div ${conflict && i>0?'class="warn"':''}>
            ${c.courseName}<br>
            <span class="small">${c.courseRef} - ${c.status}</span>
          </div>`;
        });
        if(conflict){
          html += `<div class="warn">تعارض مقررات</div>`;
        }
        html += `</td>`;
      }
    });
    html += `</tr>`;
  });

  html += `</table>`;
  document.getElementById("result").innerHTML = html;
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>بوابة الاستعلام عن جدول الاختبارات</title>

<style>
  :root{
    --bg:#eef4ff;
    --card:#ffffff;
    --stroke:#e5e7eb;
    --text:#111827;
    --muted:#6b7280;

    /* تظليل الفترات */
    --p1:#eff6ff;   /* أزرق فاتح */
    --p2:#f0fdf4;   /* أخضر فاتح */

    --primary:#2563eb;
    --danger:#dc2626;
  }

  body{font-family:Tahoma,Arial;background:var(--bg);margin:0;color:var(--text)}
  .container{max-width:1100px;margin:28px auto;background:var(--card);padding:22px;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,.07)}
  h1{margin:0 0 14px;text-align:center}

  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
  input,button{padding:12px 14px;border-radius:12px;border:1px solid var(--stroke);font-size:15px}
  input{min-width:320px;max-width:520px;width:70%}
  button.primary{background:var(--primary);color:#fff;border:none;cursor:pointer}
  button.primary:hover{opacity:.92}

  .info{background:#f8fafc;padding:12px 14px;border-radius:14px;border:1px solid var(--stroke);margin-top:12px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .infoBox{background:#fff;border:1px solid var(--stroke);border-radius:14px;padding:12px 14px}
  .infoLabel{color:var(--muted);font-size:12px;margin-bottom:4px}
  .infoValue{font-weight:800;font-size:18px}

  .no-data{background:#fef2f2;color:#991b1b;padding:12px 14px;border-radius:14px;border:1px solid #fecaca;margin-top:12px;white-space:pre-line}

  table{width:100%;border-collapse:separate;border-spacing:0;margin-top:14px;font-size:14px;border:1px solid var(--stroke);border-radius:16px;overflow:hidden}
  th,td{border-bottom:1px solid var(--stroke);border-left:1px solid var(--stroke);padding:12px;text-align:center;vertical-align:top}
  tr:last-child td{border-bottom:none}
  th:last-child, td:last-child{border-left:none}
  th{background:#f9fafb;font-weight:900}

  /* تظليل الأعمدة حسب الفترة */
  th.p1, td.p1{background:var(--p1)}
  th.p2, td.p2{background:var(--p2)}

  /* إطار كامل لكل فترة */
  td.p1, td.p2{position:relative}
  td.p1::after, td.p2::after{
    content:"";
    position:absolute;
    inset:6px;
    border:1px dashed rgba(0,0,0,.12);
    border-radius:14px;
    pointer-events:none;
  }

  /* بطاقة المادة داخل الخلية (مصغّرة) */
  .courseCard{
    background:#ffffffcc;
    border:1px solid rgba(0,0,0,.10);
    border-radius:12px;
    padding:8px 10px;            /* ✅ تصغير */
    margin:6px auto;
    max-width:240px;             /* ✅ تصغير */
    text-align:right;
    box-shadow:0 4px 12px rgba(0,0,0,.04);
  }

  .courseTitle{font-weight:900;font-size:13px;margin-bottom:4px}
  .courseMeta{color:var(--muted);font-size:12px;line-height:1.5}

  .forbidden{
    border-color:#fecaca;
    background:#fff1f2;
  }

  .warn{
    margin-top:8px;
    font-weight:900;
    color:#b91c1c;
    font-size:12px;
    text-align:center;
  }

  .hint{color:var(--muted);font-size:12px;text-align:center;margin-top:10px}
  .footer{color:var(--muted);font-size:12px;text-align:center;margin-top:16px}
</style>
</head>

<body>
<div class="container">
  <h1>بوابة الاستعلام عن جدول الاختبارات</h1>

  <div class="row">
    <input id="traineeId" placeholder="أدخل الرقم التدريبي" />
    <button class="primary" onclick="searchTrainee()">بحث</button>
  </div>

  <div class="hint">✅ تم حذف الفترة الثالثة – سيتم عرض فترتين فقط (الأولى والثانية) مع تظليل مختلف</div>

  <div id="studentResult"></div>

  <div class="footer">البيانات تُجلب من Google Sheets عبر Netlify Function</div>
</div>

<script>
/* ✅ ضع مسار Netlify Function عندك */
const API_URL = "/.netlify/functions/schedule";

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

async function callSchedule(id){
  const url = `${API_URL}?id=${encodeURIComponent(id)}`;
  const res = await fetch(url);
  return await res.json();
}

async function searchTrainee(){
  const id = document.getElementById("traineeId").value.trim();
  const box = document.getElementById("studentResult");
  box.innerHTML = "جاري البحث...";

  if(!id){
    box.innerHTML = `<div class="no-data">من فضلك أدخل الرقم التدريبي</div>`;
    return;
  }

  try{
    const data = await callSchedule(id);
    if(!data.ok){
      box.innerHTML = `<div class="no-data">${esc(data.message)}</div>`;
      return;
    }
    box.innerHTML = renderScheduleTable(data);
  }catch(err){
    box.innerHTML = `<div class="no-data">فشل الاتصال بالخادم. تأكد أن Netlify Deploy مكتمل وأن Function تعمل.</div>`;
  }
}

function renderCell(slot){
  if(!slot || slot.length === 0) return "-";

  const hasConflict = slot.length > 1;
  const anyForbidden = slot.some(c => !!c.forbidden);

  let html = "";
  slot.forEach((c, idx) => {
    const isOther = hasConflict && idx > 0;
    const cardClass = `courseCard ${c.forbidden ? "forbidden" : ""}`;

    html += `
      <div class="${cardClass}" style="${isOther ? "border-color:#fca5a5" : ""}">
        <div class="courseTitle">${esc(c.courseName)}</div>
        <div class="courseMeta">رمز المقرر: <b>${esc(c.courseRef || "")}</b></div>
        <div class="courseMeta">الحالة: ${esc(c.status || "")}</div>
      </div>
    `;
  });

  if(hasConflict){
    html += `<div class="warn">تنبيه: لديك أكثر من مقرر في نفس الفترة — تم تمييز المقرر الآخر</div>`;
  }
  if(anyForbidden){
    html += `<div class="warn">لا يمكن دخول الاختبار لأحد المقررات بسبب (حرمان/مطوي قيده)</div>`;
  }

  return html;
}

function renderScheduleTable(data){
  let html = `
    <div class="info">
      <div class="grid2">
        <div class="infoBox">
          <div class="infoLabel">اسم المتدرب</div>
          <div class="infoValue">${esc(data.traineeName)}</div>
        </div>
        <div class="infoBox">
          <div class="infoLabel">الرقم التدريبي</div>
          <div class="infoValue">${esc(data.traineeId)}</div>
        </div>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>اليوم</th>
          <th class="p1">الفترة الأولى<br><span style="color:var(--muted);font-size:12px">8:30 إلى 10:00</span></th>
          <th class="p2">الفترة الثانية<br><span style="color:var(--muted);font-size:12px">10:30 إلى 12:00</span></th>
        </tr>
      </thead>
      <tbody>
  `;

  const days = Array.isArray(data.days) ? data.days : [];
  if(days.length === 0){
    html += `<tr><td colspan="3">لا يوجد جدول اختبارات لهذا المتدرب.</td></tr>`;
  }else{
    days.forEach(d=>{
      const p1 = (d.periods && d.periods["1"]) ? d.periods["1"] : [];
      const p2 = (d.periods && d.periods["2"]) ? d.periods["2"] : [];

      html += `
        <tr>
          <td style="font-weight:900;background:#fff">${esc(d.dayLabel)}</td>
          <td class="p1">${renderCell(p1)}</td>
          <td class="p2">${renderCell(p2)}</td>
        </tr>
      `;
    });
  }

  html += `</tbody></table>`;
  return html;
}

// Enter للبحث
document.getElementById("traineeId").addEventListener("keyup", function(e){
  if(e.key === "Enter") searchTrainee();
});
</script>
</body>
</html>
